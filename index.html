<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para vos 💛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;touch-action:manipulation}
.pantalla{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:100}
#p2{display:none;z-index:90}
h1{color:white;font-size:2.4rem} h1 span{color:#ffeb3b}
input{margin-top:20px;background:#111;border:1px solid #333;color:white;padding:16px 24px;border-radius:40px;width:100%;max-width:300px;text-align:center;font-size:18px;outline:none}
.btn{margin-top:18px;background:#ffeb3b;color:#000;border:none;padding:16px 42px;border-radius:40px;font-weight:900;cursor:pointer}
.btn2{margin-top:20px;background:#ffeb3b;color:#000;border:none;padding:14px 28px;border-radius:40px;font-weight:700;cursor:pointer}
#escena{position:fixed;inset:0;background:#000;display:none;z-index:50}
#escena.show{display:block}
.jardin{position:absolute;inset:0;transition:opacity .8s}
.pasto{position:absolute;bottom:0;left:0;right:0;height:90px;background:#0f2e0f;transition:opacity .8s}
.flower{position:absolute;bottom:0;cursor:pointer;touch-action:manipulation;z-index:65;width:80px}
.tallo{width:6px;background:#2e7d32;position:absolute;bottom:0;left:50%;transform:translateX(-50%);pointer-events:none}
.flower-head{position:absolute;width:80px;height:80px;left:50%;transform:translateX(-50%);pointer-events:none}
.petal{position:absolute;width:26px;height:40px;background:#ffeb3b;border-radius:50% 50% / 60% 60%;left:50%;top:50%;transform-origin:13px 26px;pointer-events:none}
.center{position:absolute;width:22px;height:22px;background:#3e2723;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.leaf{position:absolute;width:38px;height:16px;background:#2e7d32;border-radius:0 100% 0 100%;left:7px;pointer-events:none}
.leaf.left{border-radius:100% 0 100% 0;right:7px;left:auto}
.card{background:rgba(20,20,20,.96);border:1px solid rgba(255,235,59,.5);padding:28px 24px;border-radius:24px;width:90%;max-width:380px;color:#eee;box-shadow:0 0 80px black}
#mensajeFinal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9999;display:none;transition:all .7s ease;max-height:85vh;overflow-y:auto}
#mensajeFinal.mini{top:18px;transform:translateX(-50%) scale(.88);padding:14px 16px;max-width:340px}
#contador{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9998;background:rgba(0,0,0,.85);border:1px solid #ffeb3b;color:#ffeb3b;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;display:none;transition:all .5s;white-space:nowrap}
#contador.show{display:block}
#contador.fuegos{border-color:white;color:white;background:rgba(255,235,59,.15)}
.petalos-container{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.petalos-container div{will-change:transform}
.petalo{position:absolute;top:-20px;width:12px;height:12px;background:#ffeb3b;border-radius:50% 0 50% 0;opacity:.85;animation:caer linear}
.corazon{position:fixed;font-size:22px;pointer-events:none;animation:flotar 1.2s ease-out forwards;z-index:90}
@keyframes caer{to{transform:translateY(110vh) rotate(720deg) translateX(100px)}}
@keyframes flotar{0%{transform:translate(-50%,0) scale(1);opacity:1}100%{transform:translate(-50%,-130px) scale(1.8);opacity:0}}
@keyframes crecer{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bloom{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}
#fireworks{position:fixed;inset:0;z-index:55;pointer-events:none;display:none;opacity:0;transition:opacity .8s}
#fireworks.show{display:block;opacity:1}
#luna{position:fixed;top:70px;right:30px;width:68px;height:68px;background:#ffeb3b;border-radius:50%;box-shadow:0 0 40px #ffeb3b, 0 0 80px rgba(255,235,59,.6);z-index:56;display:none;opacity:0;transition:opacity 1s}
#luna.show{display:block;opacity:1}
#luna::after{content:'';position:absolute;top:12px;left:18px;width:14px;height:14px;background:rgba(0,0,0,.15);border-radius:50%;box-shadow:12px 8px 0 -2px rgba(0,0,0,.1), -6px 14px 0 -3px rgba(0,0,0,.1)}
#musicBtn{position:fixed;top:16px;right:16px;z-index:10000;background:#111;border:1px solid #ffeb3b;color:#ffeb3b;width:46px;height:46px;border-radius:50%;display:none;cursor:pointer}
#musicBtn.show{display:flex;align-items:center;justify-content:center}
.cursor{border-right:2px solid #ffeb3b;animation:blink 1s infinite}
@keyframes blink{50%{border-color:transparent}}
</style>
</head>
<body>

<div class="pantalla" id="p1">
<div style="font-size:56px">🎁</div>
<h1>Tengo un<br><span>regalo</span> para vos</h1>
<input id="nombre" placeholder="Tu nombre..." autocomplete="off">
<button type="button" class="btn" onclick="paso2()">ABRIR 💛</button>
</div>

<div class="pantalla" id="p2">
<div class="card">
<h2 style="color:#ffeb3b">🌻 ¡Feliz Primavera! 🌻</h2>
<p id="texto" style="margin-top:14px;font-size:17px;text-align:left"></p>
<button type="button" class="btn2" id="btnJardin" style="display:none" onclick="paso3()">Ver tu jardín infinito 🎵</button>
</div>
</div>

<div id="escena">
<div class="jardin" id="jardin"></div>
<div class="pasto" id="pasto"></div>
<div class="petalos-container" id="petalos"></div>
<canvas id="fireworks"></canvas>
<div id="luna"></div>
<div class="card" id="mensajeFinal">
<h2 style="color:#ffeb3b">🌻 Para vos 🌻</h2>
<p id="texto2" style="margin-top:10px;font-size:15px;text-align:left"></p>
</div>
<div id="contador">🌻 Flores: <span id="num">0</span></div>
<button id="musicBtn" onclick="toggleMusic()">🎵</button>
</div>

<audio id="musica" loop preload="auto" playsinline>
  <source src="./flores.mp3" type="audio/mpeg">
  <source src="https://files.catbox.moe/1r5k1z.mp3" type="audio/mpeg">
</audio>

<script>
let playing=false, totalFlores=0, modo='flores';
let jardin=document.getElementById('jardin'), pasto=document.getElementById('pasto');
let nombreFinal="";

function typeWriter(el, text, speed=25, cb){
 let i=0; el.innerHTML="";
 let t=setInterval(()=>{ el.innerHTML=text.substring(0,i)+'<span class="cursor"></span>'; i++; if(i>text.length){clearInterval(t); el.innerHTML=text; if(cb)cb();} if(navigator.vibrate && i%15===0) navigator.vibrate(10); }, speed);
}

function paso2(){
 let n=document.getElementById('nombre').value.trim();
 if(n.length<2){document.getElementById('nombre').style.borderColor='red'; if(navigator.vibrate) navigator.vibrate([50,50,50]); return;}
 nombreFinal=n; if(navigator.vibrate) navigator.vibrate(100);
 let largo=`<b style="color:white;font-size:20px">${n},</b><br><br>que tengas un lindo día de la primavera, que hoy todo lo lindo florezca para vos...<br><br>Te merecés cada flor amarilla de este jardín y mucho más.<br><br>💛`;
 document.getElementById('p1').style.display='none'; document.getElementById('p2').style.display='flex';
 typeWriter(document.getElementById('texto'), largo, 25, ()=>{document.getElementById('btnJardin').style.display='inline-block';});
}

function explotarFlor(e){
 e.preventDefault(); e.stopPropagation();
 let rect=e.currentTarget.getBoundingClientRect();
 let x=rect.left+rect.width/2, y=rect.top+rect.height/2;
 if(navigator.vibrate) navigator.vibrate(30);
 for(let i=0;i<10;i++){
   let c=document.createElement('div'); c.className='corazon'; c.innerText='💛';
   c.style.left=x+'px'; c.style.top=y+'px';
   c.style.left=`calc(${x}px + ${(Math.random()-0.5)*120}px)`;
   document.body.appendChild(c); setTimeout(()=>c.remove(),1200);
 }
 let flor=e.currentTarget;
 flor.style.transition='transform .2s'; flor.style.transform='scale(0)';
 setTimeout(()=>{ flor.remove(); crearFlor(Math.random()*100, 110+Math.random()*220, 0); },250);
}

function crearFlor(x, altura, delay){
 const c=document.createElement('div'); c.className='flower'; c.style.left=x+'%'; c.style.bottom='0'; c.style.height=altura+'px'; c.style.animation=`crecer .7s ${delay}s both`; c.style.transformOrigin='bottom';
 c.addEventListener('pointerdown', explotarFlor);
 const tallo=document.createElement('div'); tallo.className='tallo'; tallo.style.height=altura+'px';
 let l1=document.createElement('div'); l1.className='leaf left'; l1.style.bottom=(altura*0.35)+'px'; tallo.appendChild(l1);
 let l2=document.createElement('div'); l2.className='leaf'; l2.style.bottom=(altura*0.6)+'px'; tallo.appendChild(l2);
 const head=document.createElement('div'); head.className='flower-head'; head.style.bottom=(altura-10)+'px'; head.style.animation=`bloom .6s ${delay+0.5}s both`;
 for(let i=0;i<6;i++){let p=document.createElement('div'); p.className='petal'; p.style.transform=`translate(-50%,-50%) rotate(${i*60}deg) translateY(-12px)`; head.appendChild(p);}
 let ce=document.createElement('div'); ce.className='center'; head.appendChild(ce);
 c.appendChild(head); c.appendChild(tallo); jardin.appendChild(c);
 totalFlores++; let numEl=document.getElementById('num'); if(numEl) numEl.innerText=totalFlores;
 if(jardin.children.length>70) jardin.firstChild.remove();
}

function crearPetalo(){ const p=document.createElement('div'); p.className='petalo'; p.style.left=Math.random()*100+'vw'; p.style.animationDuration=(3+Math.random()*4)+'s'; document.getElementById('petalos').appendChild(p); setTimeout(()=>p.remove(),7000); }

function paso3(){
 document.getElementById('p2').style.display='none';
 let escena=document.getElementById('escena'); escena.classList.add('show'); escena.style.display='block';
 document.getElementById('contador').classList.add('show');
 document.getElementById('musicBtn').classList.add('show'); document.getElementById('musicBtn').style.display='flex';
 document.getElementById('musica').volume=0.9; document.getElementById('musica').play().then(()=>playing=true).catch(()=>{});
 let msg=document.getElementById('mensajeFinal'); msg.style.display='block';
 let texto2=`${nombreFinal}, este es tu jardín infinito.<br><br>Gracias por existir 🌻`;
 typeWriter(document.getElementById('texto2'), texto2, 28);
 for(let i=0;i<28;i++) crearFlor(2+Math.random()*96, 110+Math.random()*220, Math.random()*1.2);
 setInterval(()=>{ if(modo==='flores') crearFlor(Math.random()*100, 110+Math.random()*220, 0)}, 300);
 setInterval(crearPetalo, 200);
 setTimeout(()=>msg.classList.add('mini'), 4000);
 iniciarAlternancia();
 setTimeout(()=>formarCorazon(), 15000);
 setInterval(()=>formarCorazon(), 60000);
}

function toggleMusic(){ let a=document.getElementById('musica'); if(playing){a.pause(); musicBtn.innerText='🔇';}else{a.play(); musicBtn.innerText='🎵';} playing=!playing; }

let canvas=document.getElementById('fireworks'), ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth; canvas.height=innerHeight} window.addEventListener('resize',resize); resize();
let particles=[], fireInterval=null;
function firework(x,y){ if(navigator.vibrate) navigator.vibrate([30,30,80]); for(let i=0;i<90;i++){ particles.push({x,y, vx:(Math.random()-0.5)*11, vy:(Math.random()-0.5)*11, life:100, color:`hsl(${42+Math.random()*16},100%,55%)`}) } }
function loop(){ ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(0,0,canvas.width,canvas.height); particles.forEach((p,i)=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.life--; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,2.2,0,Math.PI*2); ctx.fill(); if(p.life<=0) particles.splice(i,1); }); requestAnimationFrame(loop); } loop();

function mostrarFlores(){
 modo='flores';
 document.getElementById('fireworks').classList.remove('show'); setTimeout(()=>document.getElementById('fireworks').style.display='none',800);
 document.getElementById('luna').classList.remove('show');
 jardin.style.opacity='1'; pasto.style.opacity='1';
 if(fireInterval){clearInterval(fireInterval); fireInterval=null;}
 let cont=document.getElementById('contador'); cont.classList.remove('fuegos');
 cont.innerHTML=`🌻 Flores: <span id="num">${totalFlores}</span>`;
}
function mostrarFuegos(){
 modo='fuegos';
 let fw=document.getElementById('fireworks'); fw.style.display='block'; setTimeout(()=>fw.classList.add('show'),50);
 document.getElementById('luna').classList.add('show');
 jardin.style.opacity='0.25'; pasto.style.opacity='0.25';
 if(navigator.vibrate) navigator.vibrate([100,50,100,50,200]);
 let cont=document.getElementById('contador'); cont.classList.add('fuegos');
 cont.innerHTML=`💛 Sos mi primavera 💛 | ${nombreFinal} ✨`;
 fireInterval=setInterval(()=>{firework(Math.random()*canvas.width, Math.random()*canvas.height*0.6)}, 350);
 setTimeout(()=>firework(canvas.width/2, canvas.height*0.4),200);
}
function iniciarAlternancia(){ mostrarFlores(); setInterval(()=>{ if(modo==='flores') mostrarFuegos(); else mostrarFlores(); }, 10000); }

let formandoCorazon = false;
function formarCorazon(){
 if(formandoCorazon) return;
 formandoCorazon = true;
 if(navigator.vibrate) navigator.vibrate([40,40,80]);
 let isMobile = window.innerWidth < 600;
 let cont = document.getElementById('petalos');
 let heartWrap = document.createElement('div');
 heartWrap.style.cssText = `position:fixed;left:50%;top:${isMobile?'40%':'45%'};transform:translate(-50%,-50%);width:${isMobile?'220px':'280px'};height:${isMobile?'200px':'260px'};pointer-events:none;z-index:70`;
 cont.appendChild(heartWrap);
 let puntos = isMobile?22:28;
 for(let i=0; i<puntos; i++){
   let t = (Math.PI*2 * i / puntos);
   let x = 16*Math.pow(Math.sin(t),3);
   let y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
   let p = document.createElement('div');
   p.style.cssText = `position:absolute;left:50%;top:45%;width:10px;height:10px;background:#ffeb3b;border-radius:50% 0 50% 0;transform:translate(-50%,-50%) translate(${x*(isMobile?5.5:8)}px, ${y*(isMobile?5.5:8)}px) scale(0);transition:transform .6s ${i*0.03}s cubic-bezier(0.34,1.56,0.64,1);opacity:0.95`;
   heartWrap.appendChild(p);
   setTimeout(()=>{ p.style.transform = `translate(-50%,-50%) translate(${x*(isMobile?5.5:8)}px, ${y*(isMobile?5.5:8)}px) scale(1)`; }, 50);
 }
 let txt = document.createElement('div');
 txt.style.cssText = `position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);color:#ffeb3b;font-weight:900;font-size:${isMobile?'16px':'20px'};white-space:nowrap;text-shadow:0 0 10px rgba(255,235,59,.8);transition:transform .5s .8s;`;
 txt.innerText = `${nombreFinal} 💛`;
 heartWrap.appendChild(txt);
 setTimeout(()=>{ txt.style.transform = 'translate(-50%,-50%) scale(1)'; }, 100);
 setTimeout(()=>{
   heartWrap.style.transition = 'opacity .6s, transform .6s';
   heartWrap.style.opacity = '0';
   heartWrap.style.transform = 'translate(-50%,-50%) scale(1.4)';
   setTimeout(()=>{ heartWrap.remove(); formandoCorazon = false; }, 600);
 }, 3500);
}
</script>
</body>
</html>
